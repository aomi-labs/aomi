name: Publish npm (token)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable candidate SHA merged into main
        required: true
        type: string
      allow_package_drift:
        description: Acknowledge reviewed package-path changes on main while publishing this frozen candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Lets npm sign build provenance for each published package.
      id-token: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify the candidate under main's release policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ALLOW_PUBLISHABLE_PACKAGE_DRIFT: ${{ inputs.allow_package_drift }}
        run: |
          # The candidate is intentionally frozen, so its checkout can contain
          # an older verifier. Load the policy from main while retaining the
          # candidate checkout for the ancestry and package-diff checks below.
          git fetch origin main --quiet
          git show origin/main:.github/scripts/verify-main-ci.sh > "$RUNNER_TEMP/verify-main-ci.sh"
          chmod +x "$RUNNER_TEMP/verify-main-ci.sh"
          "$RUNNER_TEMP/verify-main-ci.sh"

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and build publishable packages
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:packages

      - name: Publish versions not already present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          node scripts/publish-package-if-needed.mjs packages/client
          # Account depends on ServiceIdentity. Older frozen candidates can
          # predate either package's public release, so inspect their manifests.
          for package_directory in packages/service-identity packages/account; do
            if [[ -f "$package_directory/package.json" ]] &&
              node -e 'process.exit(require("./" + process.argv[1] + "/package.json").private ? 1 : 0)' "$package_directory"; then
              node scripts/publish-package-if-needed.mjs "$package_directory"
            fi
          done
          if [[ -f packages/cli/package.json ]]; then
            node scripts/publish-package-if-needed.mjs packages/cli
          fi
          node scripts/publish-package-if-needed.mjs packages/deploy
          node scripts/publish-package-if-needed.mjs packages/react
          # A frozen candidate can predate the widget package-directory move.
          # Resolve its package path from that exact checkout; never substitute
          # the current-main package contents for the release candidate.
          if [[ -f packages/widget/package.json ]]; then
            node scripts/publish-package-if-needed.mjs packages/widget
          elif [[ -f apps/shadcn-registry/package.json ]]; then
            node scripts/publish-package-if-needed.mjs apps/shadcn-registry
          else
            echo "Candidate has no widget package directory" >&2
            exit 1
          fi
          # After every package is out: prove the CLI installs from the public
          # registry, using main's checker against this candidate's manifest.
          if [[ -f packages/cli/package.json ]]; then
            git show origin/main:scripts/check-published-cli.mjs > "$RUNNER_TEMP/check-published-cli.mjs"
            node "$RUNNER_TEMP/check-published-cli.mjs"
          fi
