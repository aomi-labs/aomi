name: Draft ChatRC regression evidence

on:
  push:
    branches: [codex/chat-model-switch-regression]

permissions:
  contents: read

jobs:
  chatrc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout draft test code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run deterministic browser regression on ChatRC
        env:
          AOMI_HOSTED_E2E_PORTAL_URL: https://rc.aomi.chat
        run: |
          set -euo pipefail
          AOMI_HOSTED_E2E_EVM_PRIVATE_KEY="0x$(openssl rand -hex 32)"
          echo "::add-mask::$AOMI_HOSTED_E2E_EVM_PRIVATE_KEY"
          export AOMI_HOSTED_E2E_EVM_PRIVATE_KEY
          pnpm exec playwright test --project=hosted-wallet --workers=1 --reporter=list --grep 'hosted Chat|EVM session and chat history'
