name: Preview E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read

concurrency:
  group: preview-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select preview paths
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.select.outputs.preview }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_DIFF_MODE: pull_request
        run: node .github/scripts/select-ci-paths.mjs

  playwright:
    name: Playwright Preview (non-blocking observation)
    needs: changes
    if: needs.changes.outputs.preview == 'true' && vars.PLAYWRIGHT_PREVIEW_MODE != 'nightly'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve same-SHA immutable Vercel URLs
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/resolve-preview-urls.sh

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apt's azure mirror intermittently stalls on this runner image and can
      # consume the whole job budget. The ubuntu-latest image already ships the
      # chromium system libraries, so bound this step and treat it as advisory.
      - name: Install Playwright system deps (best effort)
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Run anonymous Chat and Build smoke
        env:
          PORTAL_PREVIEW_URL: ${{ steps.previews.outputs.portal_url }}
          BUILD_PREVIEW_URL: ${{ steps.previews.outputs.build_url }}
        run: pnpm exec playwright test --project=preview

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-e2e-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish observation summary
        if: always()
        run: |
          {
            echo "## Preview E2E observation"
            echo "- Mode: non-blocking"
            echo "- Owner: CI/release DRI"
            echo "- PR SHA: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- Diagnostics: \`preview-e2e-${{ github.event.pull_request.head.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
