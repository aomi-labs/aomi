[paths]
index_dir = ".repowiki"
generated_dir = "docs/generated"

[embedding]
provider = "openai"
model = "text-embedding-3-small"

[scan]
include = [
    "AGENTS.md",
    "README.md",
    "docs/index.md",
    "docs/local-dev-stack.md",
    "docs/topics/index.md",
    "docs/topics/**/facts/**/*.md",
    "docs/generated/**/*.md",
    "specs/*.md",
]
exclude = [
    ".claude/**",
    ".codex/**",
    ".git/**",
    ".next/**",
    ".repowiki/**",
    ".turbo/**",
    ".vercel/**",
    "coverage/**",
    "dist/**",
    "memory/**",
    "node_modules/**",
    "apps/**/.next/**",
    "apps/registry/dist/**",
    "packages/**/dist/**",
    "**/diffHistory.md",
]

[[source_rule]]
name = "root-guidance"
glob = "AGENTS.md"
kind = "guide"
default_status = "authoritative"
default_area = "development"
default_owner = "platform"
require_metadata = false

[[source_rule]]
name = "root-readme"
glob = "README.md"
kind = "reference"
default_status = "reference"
default_area = "development"
default_owner = "platform"
require_metadata = false

[[source_rule]]
name = "docs-index"
glob = "docs/index.md"
kind = "index"
default_status = "authoritative"
default_area = "repowiki"
default_owner = "platform"
require_metadata = true

[[source_rule]]
name = "local-dev-stack"
glob = "docs/local-dev-stack.md"
kind = "guide"
default_status = "reference"
default_area = "development"
default_owner = "platform"
require_metadata = false

[[source_rule]]
name = "topics-index"
glob = "docs/topics/index.md"
kind = "index"
default_status = "authoritative"
default_area = "repowiki"
default_owner = "platform"
require_metadata = true

[[source_rule]]
name = "topics"
glob = "docs/topics/**/facts/**/*.md"
kind = "topic"
default_status = "authoritative"
default_owner = "platform"
require_metadata = true

[[source_rule]]
name = "generated"
glob = "docs/generated/**/*.md"
kind = "generated"
default_status = "authoritative"
default_owner = "platform"
require_metadata = false

[[source_rule]]
name = "specs"
glob = "specs/*.md"
kind = "reference"
default_status = "reference"
default_area = "development"
default_owner = "platform"
require_metadata = false

[[area]]
name = "development"
code = [
    "package.json",
    "pnpm-workspace.yaml",
    "scripts/**",
    "apps/landing/package.json",
    "apps/registry/package.json",
    "packages/client/package.json",
    "packages/react/package.json",
]
docs = [
    "docs/topics/development/facts/workspace.md",
    "docs/local-dev-stack.md",
]
owners = ["platform", "frontend"]

[[area]]
name = "apps"
code = [
    "apps/base/**",
    "apps/landing/**",
    "apps/portal/**",
    "apps/telegram/**",
    "apps/registry/src/components/aomi-frame.tsx",
    "apps/registry/src/components/assistant-ui/**",
    "apps/registry/src/components/control-bar/**",
    "apps/registry/src/index.ts",
    "src/components/assistant-ui/runtime.tsx",
]
docs = [
    "docs/topics/apps/facts/app-surfaces.md",
    "docs/topics/apps/facts/widget-frame.md",
]
owners = ["frontend"]

[[area]]
name = "client-runtime"
code = [
    "packages/react/src/contexts/**",
    "packages/react/src/handlers/**",
    "packages/react/src/interface.tsx",
    "packages/react/src/runtime/**",
    "packages/react/src/state/**",
    "packages/react/src/utils/**",
    "packages/client/bin/**",
    "packages/client/src/cli.ts",
    "packages/client/src/cli/**",
    "packages/client/src/client.ts",
    "packages/client/src/event.ts",
    "packages/client/src/index.ts",
    "packages/client/src/session.ts",
    "packages/client/src/sse.ts",
    "packages/client/src/types.ts",
]
docs = [
    "docs/topics/client-runtime/facts/react-runtime.md",
    "docs/topics/client-runtime/facts/transport-client.md",
    "docs/topics/client-runtime/facts/cli.md",
]
owners = ["frontend", "sdk"]

[[area]]
name = "auth"
code = [
    "packages/auth/**",
    "apps/portal/src/app/api/auth/**",
    "apps/portal/src/lib/aomi-account/**",
    "apps/registry/src/lib/wallet-kit/**",
    "packages/react/src/runtime/user-state-provider.tsx",
]
docs = [
    "docs/topics/auth/facts/auth.md",
    "docs/topics/auth/facts/wallet-kit.md",
    "docs/topics/auth/facts/base-account.md",
]
owners = ["frontend"]
