<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" style="font-size:11px" role="img" aria-label="Arc Studio supplies source, compiled artifact and deployments to an Aomi app containing the agent and the campaign engine; the engine executes on a held Arc fork; the report returns to the builder."><style>
text{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
.n-box{fill:#fff;stroke:#d4d4d8;stroke-width:1.2}.n-kept{stroke:#09090b}.n-pruned{stroke:#a1a1aa;stroke-dasharray:4 3}
.n-bad{fill:#fbe9eb;stroke:#d2495b;stroke-width:1.8}.n-ok{fill:#e4f3ec;stroke:#2e9e6b;stroke-width:1.8}
.edge{stroke:#d4d4d8;stroke-width:1.4;fill:none}.edge-hot{stroke:#d2495b;stroke-width:2}
.t-main{fill:#09090b;font-size:12.5px}.t-sub{fill:#71717a;font-size:11px}.t-bad{fill:#d2495b;font-size:11px;font-weight:500}
.t-ok{fill:#2e9e6b;font-size:11px;font-weight:500}.t-pruned{fill:#a1a1aa;font-size:12.5px}.t-axis{fill:#71717a;font-size:11px;letter-spacing:.08em}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4d4d8"/></marker></defs>
      <rect x="10" y="40" width="190" height="150" rx="10" fill="#f4f4f5" stroke="none"/>
      <text class="t-axis" x="26" y="64">ARC STUDIO · THE BUILDER</text>
      <text class="t-main" x="26" y="92">source + compiled artifact</text><text class="t-main" x="26" y="114">the account's deployments</text><text class="t-sub" x="26" y="136">via the builder's token</text>
      <text class="t-main" x="26" y="170">← report + drafted fix</text>
      <path class="edge" d="M200 100 L 240 100" marker-end="url(#a)"/>
      <rect x="240" y="20" width="400" height="190" rx="10" fill="#fff" stroke="#5288c2" stroke-width="1.5"/>
      <text class="t-axis" x="256" y="44" fill="#5288c2">AOMI APP · THE AGENTIC FUZZER</text>
      <rect x="256" y="60" width="170" height="130" rx="8" fill="#cfe1f3" stroke="none"/>
      <text class="t-axis" x="268" y="82">THE AGENT</text><text class="t-main" x="268" y="106">threat model</text><text class="t-main" x="268" y="126">rules + actors</text><text class="t-main" x="268" y="146">action templates</text><text class="t-sub" x="268" y="170">model from Aomi's catalog</text>
      <path class="edge" d="M426 110 L 452 110"/><path class="edge" d="M452 130 L 426 130"/>
      <rect x="452" y="60" width="172" height="130" rx="8" fill="#f4f4f5" stroke="#09090b" stroke-width="1.2"/>
      <text class="t-axis" x="464" y="82">CAMPAIGN ENGINE</text><text class="t-main" x="464" y="106">validates the plan</text><text class="t-main" x="464" y="126">frontier · dedup · order</text><text class="t-main" x="464" y="146">minimize · replay ×2</text><text class="t-sub" x="464" y="170">deterministic code</text>
      <path class="edge" d="M640 115 L 680 115"/>
      <rect x="680" y="40" width="215" height="150" rx="10" fill="#e4f3ec" stroke="#2e9e6b" stroke-width="1.5"/>
      <text class="t-axis" x="696" y="64" fill="#2e9e6b">HELD ARC FORK</text>
      <text class="t-main" x="696" y="92">chain 5042, pinned block</text><text class="t-main" x="696" y="114">installs or runs in place</text><text class="t-main" x="696" y="136">funds actors, runs calls</text><text class="t-sub" x="696" y="170">never signs or broadcasts</text>
    </svg>