<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Phylax Credible Layer evaluates transactions during block building</title>
  <desc id="desc">A protocol team publishes an assertion release through the Phylax platform. Credible Layer contracts identify active assertions and Assertion Data Availability stores their code. During block production, an integrated block builder sends a candidate transaction to an Assertion Enforcer sidecar. PhEVM simulates the transaction against pre-transaction and post-transaction state, then returns a valid or invalid report. The network applies that result through its own inclusion policy.</desc>
  <defs>
    <style>
      .bg{fill:#f8f9fb}.panel{fill:#fff;stroke:#c9d2dc;stroke-width:1.5}.network{fill:#f2f6fa;stroke:#9bb7cb;stroke-width:1.5}.mask{fill:#f2f6fa}.enforcer{fill:#edf5fb;stroke:#285c87;stroke-width:1.8}.engine{fill:#dceaf5;stroke:#6e9fbe;stroke-width:1.5}.registry{fill:#f1f3f6;stroke:#aeb8c3;stroke-width:1.5}.valid{fill:#e3f0e6;stroke:#6f9a7a;stroke-width:1.5}.invalid{fill:#f8e6ed;stroke:#ca7897;stroke-width:1.5}.ink{fill:#18202a}.muted{fill:#586675}.blue{fill:#285c87}.green{fill:#4f795b}.pink{fill:#9a4d6b}.label{font:700 13px Arial,sans-serif;letter-spacing:.09em}.stage{font:700 25px Arial,sans-serif}.name{font:700 17px Arial,sans-serif}.body{font:15px Arial,sans-serif}.small{font:13px Arial,sans-serif}.mono{font:14px "Courier New",monospace}.note{font:italic 14px Arial,sans-serif}.step{font:700 13px Arial,sans-serif}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#778696"/></marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#285c87"/></marker>
  </defs>

  <rect class="bg" width="1100" height="720" rx="20"/>
  <text class="label muted" x="46" y="52">PHYLAX CREDIBLE LAYER · GATE 3</text>
  <text class="stage ink" x="46" y="88">The builder asks an assertion sidecar before including the transaction.</text>

  <!-- Runtime path. -->
  <rect class="network" x="46" y="126" width="1008" height="332" rx="18"/>
  <text class="label blue" x="70" y="157">INTEGRATED NETWORK · BLOCK-PRODUCTION PATH</text>

  <rect class="panel" x="70" y="195" width="256" height="118" rx="14"/>
  <text class="label muted" x="92" y="224">NETWORK OPERATOR</text>
  <text class="name ink" x="92" y="256">Block builder or sequencer</text>
  <text class="small muted" x="92" y="282">selects candidate transactions</text>

  <rect class="enforcer" x="420" y="178" width="298" height="224" rx="16"/>
  <text class="label blue" x="442" y="208">ASSERTION ENFORCER · SIDECAR</text>
  <text class="small muted" x="442" y="232">finds the active rules for affected contracts</text>
  <rect class="engine" x="442" y="256" width="254" height="96" rx="12"/>
  <text class="name ink" x="569" y="287" text-anchor="middle">PhEVM</text>
  <text class="body muted" x="569" y="314" text-anchor="middle">simulates the candidate transaction</text>
  <text class="small blue" x="569" y="337" text-anchor="middle">pre-state → post-state</text>
  <text class="small muted" x="569" y="381" text-anchor="middle">executes each triggered assertion</text>

  <rect class="valid" x="812" y="192" width="218" height="76" rx="12"/>
  <text class="label green" x="834" y="220">VALID</text>
  <text class="body ink" x="834" y="246">eligible for inclusion</text>

  <rect class="invalid" x="812" y="292" width="218" height="76" rx="12"/>
  <text class="label pink" x="834" y="320">INVALID</text>
  <text class="body ink" x="834" y="346">excluded on this route</text>

  <path d="M326 246 H414" stroke="#285c87" stroke-width="2.5" marker-end="url(#arrowblue)"/>
  <text class="step blue" x="370" y="230" text-anchor="middle">1</text>
  <text class="small muted" x="370" y="270" text-anchor="middle">candidate tx</text>

  <path d="M718 230 H806" stroke="#6f9a7a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M718 330 H806" stroke="#ca7897" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="step blue" x="762" y="214" text-anchor="middle">3</text>
  <rect class="mask" x="716" y="266" width="94" height="22" rx="4"/>
  <text class="small muted" x="762" y="282" text-anchor="middle">validation report</text>

  <path d="M569 402 C540 452 350 435 286 320" fill="none" stroke="#778696" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect class="mask" x="416" y="407" width="306" height="24" rx="4"/>
  <text class="step blue" x="557" y="433" text-anchor="middle">4 · network applies its inclusion policy</text>

  <!-- Assertion lifecycle. -->
  <text class="label muted" x="46" y="501">ASSERTION LIFECYCLE · SEPARATE FROM THE TRANSACTION HOT PATH</text>

  <rect class="panel" x="46" y="528" width="222" height="112" rx="14"/>
  <text class="label muted" x="68" y="557">PROTOCOL TEAM</text>
  <text class="name ink" x="68" y="587">Assertion release</text>
  <text class="small muted" x="68" y="613">written in Solidity and published</text>

  <rect class="registry" x="344" y="528" width="260" height="112" rx="14"/>
  <text class="label muted" x="366" y="557">CREDIBLE LAYER CONTRACTS</text>
  <text class="name ink" x="366" y="587">Active assertion registry</text>
  <text class="small muted" x="366" y="613">maps rules to protected contracts</text>

  <rect class="registry" x="680" y="528" width="220" height="112" rx="14"/>
  <text class="label muted" x="702" y="557">ASSERTION DA</text>
  <text class="name ink" x="702" y="587">Code and artifacts</text>
  <text class="small muted" x="702" y="613">available to the enforcer</text>

  <path d="M268 584 H338" stroke="#778696" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="small muted" x="303" y="569" text-anchor="middle">activate</text>
  <path d="M274 616 C408 674 610 674 680 616" fill="none" stroke="#778696" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="small muted" x="474" y="682" text-anchor="middle">platform stores release artifact</text>
  <path d="M604 556 C651 502 554 466 554 408" fill="none" stroke="#285c87" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowblue)"/>
  <path d="M790 528 C778 468 676 454 638 406" fill="none" stroke="#285c87" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowblue)"/>
  <rect class="bg" x="550" y="463" width="294" height="24" rx="4"/>
  <text class="step blue" x="696" y="486" text-anchor="middle">2 · load active rules and cached bytecode</text>

  <rect class="panel" x="46" y="672" width="1008" height="32" rx="8"/>
  <text class="label muted" x="68" y="693">BUILDER-ROUTE ENFORCEMENT, NOT A BASE-CONSENSUS VALIDITY RULE</text>
</svg>
