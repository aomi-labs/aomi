<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="585" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc">
  <title id="title">One action envelope, several independent decisions</title>
  <desc id="desc">An exact action envelope holds user mandate, account and chain, calls, caps, simulation reference, and policy versions. Runtime, wallet, contract, and builder evaluate different portions of it. Receipts are reconciled afterward.</desc>
  <defs>
    <style>.bg{fill:#f8f9fb}.box{fill:#fff;stroke:#dce3ea;stroke-width:1.5}.core{fill:#eaf2fa;stroke:#76a5cf;stroke-width:2}.pink{fill:#fbe9f0;stroke:#db7ca0;stroke-width:1.5}.ink{fill:#18202a}.muted{fill:#586675}.blue{fill:#2d6798}.head{font:700 14px Arial,sans-serif;letter-spacing:.09em}.title{font:700 23px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b9cac"/></marker>
  </defs>
  <rect class="bg" width="1100" height="585" rx="20"/>
  <text class="head muted" x="45" y="53">PROVENANCE AND POLICY</text>
  <text class="title ink" x="45" y="88">Make every veto answer a question about the same action.</text>
  <rect class="core" x="351" y="148" width="398" height="309" rx="15"/>
  <text class="head blue" x="380" y="182">ACTION ENVELOPE</text>
  <text class="title ink" x="380" y="218">Exact request, not a summary</text>
  <path d="M380 236H720" stroke="#b9d2e6" stroke-width="1.5"/>
  <text class="body ink" x="380" y="269">User mandate + account + chain</text>
  <text class="body ink" x="380" y="305">Destination + calldata + nonce</text>
  <text class="body ink" x="380" y="341">Asset debits + cap + deadline</text>
  <text class="body ink" x="380" y="377">Simulation block + policy versions</text>
  <text class="small muted" x="380" y="424">Bind the final signing request to this object.</text>
  <g>
    <rect class="box" x="45" y="166" width="240" height="106" rx="12"/>
    <text class="head blue" x="66" y="199">0.5  RUNTIME</text><text class="body ink" x="66" y="231">Is this build allowed?</text>
    <path d="M285 219H342" stroke="#8b9cac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="pink" x="45" y="330" width="240" height="106" rx="12"/>
    <text class="head" fill="#9a4d6b" x="66" y="363">1  WALLET</text><text class="body ink" x="66" y="395">May this key sign?</text>
    <path d="M285 383H342" stroke="#8b9cac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="pink" x="815" y="166" width="240" height="106" rx="12"/>
    <text class="head" fill="#9a4d6b" x="836" y="199">2  CONTRACT</text><text class="body ink" x="836" y="231">Is authority valid?</text>
    <path d="M749 219H805" stroke="#8b9cac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect class="pink" x="815" y="330" width="240" height="106" rx="12"/>
    <text class="head" fill="#9a4d6b" x="836" y="363">3  BUILDER</text><text class="body ink" x="836" y="395">Is the effect allowed?</text>
    <path d="M749 383H805" stroke="#8b9cac" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <path d="M550 458V489" stroke="#8b9cac" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="box" x="351" y="500" width="398" height="49" rx="10"/>
  <text class="head muted" x="380" y="530">RECEIPT + BALANCE RECONCILIATION</text>
</svg>
