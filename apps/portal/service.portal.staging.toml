# AOMI service topology — STAGING. The portal's committed view of the mesh.
# Public keys MUST match the backend's `service.staging.toml`. Private keys live
# only in env: the portal sets PORTAL_SERVICE_PRIVATE_KEY (aomi-bff);
# admin tooling holds the aomi-admin private key.
# The portal auto-selects this file when targeting staging.

[[services]]
name = "aomi-bff"
kid = "aomi-bff-staging-1"
issues = ["user", "service"]
audiences = ["aomi-backend", "aomi-api-server", "aomi-sidecar", "aomi-payment"]
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAgLSENuOGsWvaeM+7eU6BWSp9tY61HF7Ml4Vv/fxaupY=
-----END PUBLIC KEY-----
"""

[[services]]
name = "aomi-admin"
kid = "aomi-admin-staging-1"
issues = ["admin"]
audiences = ["aomi-backend"]
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEA3ceXzJJN8EVzXNhrUREq3JrKUWvWKNj4JpQcS4lNvss=
-----END PUBLIC KEY-----
"""

[[services]]
name = "aomi-backend"
kid = "aomi-backend"
issues = []
audiences = []
public_key = ""
