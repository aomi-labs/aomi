# AOMI service topology — PRODUCTION. The portal's committed view of the mesh.
# Public keys MUST match the backend's `service.production.toml`. Private keys
# live only in env: the portal sets PORTAL_SERVICE_PRIVATE_KEY (aomi-bff);
# admin tooling holds the aomi-admin private key.
# The portal auto-selects this file when targeting production.

[[services]]
name = "aomi-bff"
kid = "aomi-bff-prod-1"
issues = ["user", "service"]
audiences = ["aomi-backend", "aomi-api-server", "aomi-sidecar", "aomi-payment"]
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAyaIwzD82igAdhA3xw9Tkr5yJEpaRU3SY73bVqjE7Ajc=
-----END PUBLIC KEY-----
"""

[[services]]
name = "aomi-admin"
kid = "aomi-admin-prod-1"
issues = ["admin"]
audiences = ["aomi-backend"]
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEApsGOtLjeUdfZJYzuwiRz2JegR00bK31s+Q+HHoNdz1s=
-----END PUBLIC KEY-----
"""

[[services]]
name = "aomi-backend"
kid = "aomi-backend"
issues = []
audiences = []
public_key = ""
