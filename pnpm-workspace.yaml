packages:
  - .
  - apps/*
  - apps/examples/*
  - packages/*

overrides:
  viem: 2.47.11
  # Collapse react/react-dom to one version. Bun bundles the aomi-smither
  # browser console (packages/smither/src/ui) at gateway request time; with two
  # react copies in the tree its dedupe resolves react@19.2.3 against
  # react-dom@19.2.7 and the app dies on "Incompatible React versions". Every
  # workspace consumer declares ^19.2.0, so pinning 19.2.7 is an in-range patch
  # alignment, not a bump past anyone's range.
  react: 19.2.7
  react-dom: 19.2.7
  # Pin a single @types/react so peer-dep resolution doesn't fan out into
  # multiple physical copies of @assistant-ui/* (react/store/core). Duplicate
  # copies each get their own React context, which breaks the shared AuiProvider
  # (the runtime provider and the UI primitives would resolve to different
  # instances → "requires an AuiProvider" at runtime).
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3

# @inkjs/ui declares no react dependency (nor peer), so its bare `import react`
# falls through to a hoisted copy that differs from the one ink's reconciler is
# bound to — "Invalid hook call" crashes the aomi-smither TUI at startup.
# Granting it a react peer makes pnpm resolve react within the smither context
# so it shares ink's instance. (Restored after the main merge relocated pnpm
# config here from package.json.)
packageExtensions:
  "@inkjs/ui":
    peerDependencies:
      react: "*"
  # react-sdk imports these chain-specific react-core entrypoints at runtime,
  # but 2.24.0 omits react-core from its published dependency manifest. Keep
  # pnpm from resolving an unrelated hoisted version from another workspace.
  "@getpara/react-sdk@2.24.0":
    dependencies:
      "@getpara/react-core": "2.24.0"

# @better-auth/mcp 1.7.1 automatically adds its primary MCP endpoint to every
# dynamically registered client's default resources. This widens Agent,
# Pipeline, and REST clients even when they request one exact resource. Aomi
# binds resource-less RFC 7591 clients on their first authorize request instead.
patchedDependencies:
  "@better-auth/mcp@1.7.1": patches/@better-auth__mcp@1.7.1.patch
  "@better-auth/oauth-provider@1.7.1": patches/@better-auth__oauth-provider@1.7.1.patch
  "next@16.1.0": patches/next@16.1.0.patch

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@reown/appkit"
  - "@smithers-orchestrator/jj-darwin-arm64"
  - "@tailwindcss/oxide"
  - bufferutil
  - es5-ext
  - esbuild
  - keccak
  - msgpackr-extract
  - protobufjs
  - secp256k1
  - sharp
  - tiny-secp256k1
  - unrs-resolver
  - utf-8-validate

allowBuilds:
  "@parcel/watcher": true
  "@reown/appkit": true
  "@smithers-orchestrator/jj-darwin-arm64": true
  "@tailwindcss/oxide": true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  protobufjs: true
  secp256k1: true
  sharp: true
  tiny-secp256k1: true
  unrs-resolver: true
  utf-8-validate: true
